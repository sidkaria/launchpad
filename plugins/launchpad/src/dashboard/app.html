/* ── needs you ───────────────────────────────────────────────────────────
   The strip. Everything it renders comes out of `DATA.needs`, which is
   `src/needs.ts` — the page computes no grouping, no price wording and no
   counts of its own, because three copies of one mapping is three chances for
   the strip to file something differently from the terminal. On a project page
   it narrows to that project's rows (`p.needs`, the keys `projectNeeds()`
   picked) and says the rest of the fleet in one line. */
const NEED_ICON = {
  'paste-credential': 'key',
  'confirm': 'help',
  'decide-money': 'zap',
  'acknowledge-irreversible': 'shield',
  'keep-or-migrate': 'layers',
  'store-gate': 'box',
  'refused-surface': 'alert',
};
const NEED_GROUPS = [
  ['blocks', 'Blocks a release'],
  ['money', 'Costs money'],
  ['irreversible', 'Cannot be undone'],
  ['facts', 'Only you can answer'],
];

/** Which projects a row is about: one chip, or a count when it is account-wide. */
function needWho(n) {
  const first = DATA.projects.find(p => p.path === n.projectPath);
  const mark = first ? markOf(first, 'xs') : '';
  const extra = n.projects.length - 1;
  const text = extra > 0 ? `${esc(n.project)} +${extra}` : esc(n.project);
  const title = n.projects.map(p => p.label).join(', ');
  return `<span class="who" title="${esc(title)}">${mark}<span class="nm">${text}</span></span>`;
}

/**
 * The price chip on a card.
 *
 * `costLabel` is written by `needs.ts`, never composed here — the chip a buyer
 * reads and the number the ledger adds have to come out of the same place, or
 * the strip and the Decisions tab quote two prices for one subscription.
 */
const needCost = n => (n.costLabel
  ? `<span class="pill ${n.cost && n.cost.amount ? 'cost' : 'free'}"
       title="${esc(n.costClass || '')}">${esc(n.costLabel)}</span>`
  : '');

/**
 * How far through a credential set the vault already is.
 *
 * Only where there is more than one key, because "0 of 1" is noise. This is the
 * thing a card-per-vault-key list could not say at all: the four keys of an
 * upload keystore were four strangers, so there was nowhere to put "you have
 * two of these already".
 */
const needProgress = n => {
  const a = n.action;
  return a.type === 'paste-credential' && a.total > 1
    ? `<em>${a.present} of ${a.total} stored</em>` : '';
};

function renderNeedsStrip() {
  const el = $('#needs');
  const p = cur();
  if (p) return renderProjectNeeds(el, p);
  el.dataset.scope = 'fleet';
  const items = DATA.needs || [];
  const ledger = DATA.ledger;
  // An empty list is good news only when something was looked at. With no
  // project added it said "Every credential is in your vault" about a fleet of
  // zero — the same false comfort `launchpad needs` used to print.
  if (!items.length && !(DATA.projects || []).length) {
    el.className = 'needs clear';
    el.innerHTML = `<div class="needshead">
      <span class="ic">${ico('alert', 'sm')}</span>
      <b>Nothing to check yet</b>
      <span class="sub">No project has been added. Run <code>/launchpad:onboard</code> in the repo you want
        to ship, and what it needs from you appears here.</span>
      <span class="spacer"></span>${costChip(ledger, 'this fleet')}</div>`;
    return;
  }
  if (!items.length) {
    el.className = 'needs clear';
    el.innerHTML = `<div class="needshead">
      <span class="ic">${ico('check', 'sm')}</span>
      <b>Nothing needs you</b>
      <span class="sub">Every credential is in your vault, and nothing is waiting on a decision only you
        can make.</span>
      <span class="spacer"></span>${costChip(ledger, 'this fleet')}</div>`;
    return;
  }
  el.className = 'needs';
  el.innerHTML = `
    <div class="needshead">
      <span class="ic">${ico('alert', 'sm')}</span>
      <b>${items.length} thing${items.length === 1 ? '' : 's'} need${items.length === 1 ? 's' : ''} you</b>
      <span class="needcounts">${needCounts(items)}</span>
      <span class="spacer"></span>${costChip(ledger, 'this fleet')}
    </div>
    <div class="needbody">${needGroups(items)}</div>`;
}

/** One pill per group that has anything in it: "3 · blocks a release". */
function needCounts(items) {
  return NEED_GROUPS
    .map(([g, label]) => [items.filter(n => n.group === g).length, label])
    .filter(([n]) => n > 0)
    .map(([n, label]) => `<span class="pill">${n} · ${esc(label.toLowerCase())}</span>`)
    .join('');
}

/** The cards, under their group headings, in `needs.ts`'s order. */
function needGroups(items) {
  return NEED_GROUPS.map(([g, label]) => {
    const mine = items.filter(n => n.group === g);
    if (!mine.length) return '';
    return `<div class="needgroup" data-g="${g}">
      <div class="lbl"><i></i>${esc(label)} · ${mine.length}</div>
      ${mine.map((n, i) => needCard(n, i)).join('')}</div>`;
  }).join('');
}

/**
 * The strip on a project page: this project's rows, and the fleet as one line.
 *
 * The fleet-wide list on every page put another project's Android keystore in
 * the first 450px of a Rust CLI's page (JOURNEY.md, ledger #27). Everything is
 * still one click away — the line is a link to the fleet page, where the whole
 * list is — and the sidebar keeps the fleet total, because that count answers
 * "is anything waiting on me anywhere", which a project page does not change.
 *
 * Which rows belong here is `p.needs`, the keys `projectNeeds()` chose on the
 * server. An account-wide row (the Apple membership, a Cloudflare token) is on
 * the page of every project it applies to, exactly as it is in the terminal's
 * `needs --json` filtered to that project.
 */
function renderProjectNeeds(el, p) {
  el.dataset.scope = 'project';
  const all = DATA.needs || [];
  const mine = new Set(p.needs || []);
  const items = all.filter(n => mine.has(n.key));
  const rest = all.length - items.length;
  const fleet = rest > 0
    ? `<button class="needsmore" onclick="go(null)" title="The full list, on the fleet page">
        ${rest} ${items.length ? 'more ' : ''}across the fleet${ico('chev', 'sm')}</button>`
    : '';
  if (!items.length) {
    // Not "nothing needs you": that sentence is about the whole fleet, and on a
    // project launchpad could not read it would be a claim about nothing.
    el.className = 'needs clear';
    el.innerHTML = `<div class="needshead">
      <span class="ic">${ico(p.problem ? 'minus' : 'check', 'sm')}</span>
      <b>${p.problem ? `Nothing measured on ${esc(p.name)} yet` : `Nothing on ${esc(p.name)} needs you`}</b>
      <span class="spacer"></span>${fleet}</div>`;
    return;
  }
  el.className = 'needs';
  el.innerHTML = `
    <div class="needshead">
      <span class="ic">${ico('alert', 'sm')}</span>
      <b>${items.length} thing${items.length === 1 ? '' : 's'} here need${items.length === 1 ? 's' : ''} you</b>
      <span class="needcounts">${needCounts(items)}</span>
      <span class="spacer"></span>${fleet}
    </div>
    <div class="needbody">${needGroups(items)}</div>`;
}

/**
 * One row: who it is about, what it is, what it costs, and the ONE action.
 *
 * The title is a button of its own so the whole row explains itself on click —
 * a card that can only be acted on and never read is a card people click to
 * find out what it was.
 */
function needCard(n, i) {
  const idx = (DATA.needs || []).indexOf(n);
  return `<div class="needcard"${rise(Math.min(i * 28, 260))} data-need="${esc(n.key)}"
      data-kind="${esc(n.kind)}">
    ${needWho(n)}
    <span class="t" role="button" tabindex="0" onclick="openNeed(${idx})"
      onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openNeed(${idx})}"
      >${ico(NEED_ICON[n.kind] || 'help', 'sm')} ${esc(n.title)}${needProgress(n)}</span>
    ${needCost(n)}
    <button class="btn sm ${n.kind === 'refused-surface' ? 'ghost' : ''}"
      onclick="actOnNeed(${idx})">${esc(n.action.label)}</button>
  </div>`;
}

/**
 * The cost tile, compact. Opens the full ledger, because a total nobody can
 * trace to a decision is a total nobody believes — and this one is assembled
 * out of the same cost chips the Decisions tab renders.
 */
function costChip(ledger, scope) {
  if (!ledger) return '';
  return `<button class="costchip" onclick="openLedger(${esc(JSON.stringify(scope))})"
      title="What ${esc(scope)} costs — click for the breakdown">
    ${ico('zap', 'sm')}<b>${esc(ledger.summary)}</b>
    <span class="z">${esc(ledger.summaryClass)}</span></button>`;
}

/** The ledger, spelled out: the three cadences, the split, and what has no number. */
function ledgerHtml(ledger, scope) {
  const row = (b, suffix) => {
    if (!b.total) return '';
    const split = [
      b.unavoidable ? `$${b.unavoidable} unavoidable` : '',
      b.launchpadsChoice ? `$${b.launchpadsChoice} launchpad's choice` : '',
      b.optional ? `$${b.optional} optional` : '',
    ].filter(Boolean).join(' · ');
    return `<div class="ledgerrow"><span class="n">$${b.total}</span>
      <span>${esc(suffix)}</span><span class="split">${esc(split)}</span></div>`;
  };
  const rows = row(ledger.monthly, 'a month') + row(ledger.yearly, 'a year') + row(ledger.oneTime, 'once');
  const unpriced = (ledger.unpriced || []).map(u =>
    `<div class="ledgernote">${ico('help', 'sm')} <b>${esc(u.label)}</b>${u.project ? ` (${esc(u.project)})` : ''}
      — ${esc(u.why)}</div>`).join('');
  return `<div class="ledger">
    ${rows || `<div class="ledgernote">Nothing recurring and nothing one-off. Every platform launchpad
      chose for ${esc(scope)} has a free tier that covers what you are doing.</div>`}
    ${ledger.perYear ? `<div class="ledgernote"><b>$${ledger.perYear} a year</b> in total, before anything
      metered.</div>` : ''}
    ${unpriced}
    <div class="ledgernote">Every number here is the cost chip of a decision on the Decisions tab.
      Nothing is estimated, and anything billed by use is listed rather than guessed at.</div>
  </div>`;
}

function openLedger(scope) {
  const p = cur();
  const ledger = p && scope !== 'this fleet' ? p.ledger : DATA.ledger;
  drawer(scope === 'this fleet' ? 'Fleet' : scope, 'What this costs', ledgerHtml(ledger, scope));
}

/** The whole item, with its reasoning, what it blocks, and how to answer it. */
function openNeed(i) {
  const n = (DATA.needs || [])[i];
  if (!n) return;
  const a = n.action;
  let body = `<p>${md(n.why)}</p>
    <h4>${ico('route', 'sm')}<span class="lbl">What this blocks</span></h4>
    <p>${md(n.blocks)}</p>
    ${n.warning ? `<div class="note bad">${ico('alert')}<span>${md(n.warning)}</span></div>` : ''}`;
  if (n.costLabel) {
    body += `<h4>${ico('zap', 'sm')}<span class="lbl">What it costs</span></h4>
      <p>${esc(n.costLabel)} — ${esc(n.costClass || '')}.</p>`;
  }
  if (n.projects.length > 1) {
    body += `<h4>${ico('layers', 'sm')}<span class="lbl">Answer it once</span></h4>
      <p>This is the same question for ${esc(n.projects.map(x => x.label).join(', '))}. Answering it here
      answers it for all of them.</p>`;
  }
  if (a.type === 'paste-credential') {
    /**
     * The command, never a field.
     *
     * There is no input on this page that takes a credential and there is not
     * going to be one: a value typed into a browser is in the DOM, in the
     * browser's memory, and one autofill away from a password manager that
     * thinks it is a login form. `launchpad secret` reads it from a terminal
     * straight into the OS vault, and nothing in between ever sees it.
     */
    const one = a.total === 1;
    body += `<h4>${ico('key', 'sm')}<span class="lbl">${
      a.total > 1 ? `What comes out of it — ${a.present} of ${a.total} stored` : 'What this is'}</span></h4>
      <div class="credkeys">${a.keys.map(k => `<div class="credkey">
        <div class="ck1"><code>${esc(k.vaultKey)}</code>${k.present
          ? `<span class="pill live">${ico('check')}stored</span>`
          : `<span class="pill danger">${ico('alert')}missing</span>`}</div>
        <div class="ck2">${md(k.what)} <span class="dir">· CI reads it as ${esc(k.secretName)}</span></div>
      </div>`).join('')}</div>
      <h4 style="margin-top:18px">${ico('play', 'sm')}<span class="lbl">Store ${one ? 'it' : 'the missing ones'}</span></h4>
      <p>Run ${a.commands.length === 1 ? 'this' : 'these'} in a terminal — each asks for the value and shows
      nothing as you paste. Mission Control has no field for a credential value, deliberately: what you paste
      into a browser is in the page, and this goes straight into ${esc(vaultPlace())}.</p>
      ${a.commands.map(c => `<code class="cmd">${esc(runCmd(c))}</code>`).join('')}
      <button class="btn ghost sm" style="margin-top:10px"
        onclick="copy(${esc(JSON.stringify(a.commands.map(runCmd).join('\n')))},${a.commands.length === 1 ? "'Command'" : "'Commands'"})">
        ${ico('copy', 'sm')}Copy</button>
      <p style="margin-top:16px">It is <b>${esc(a.scope === 'per-app' ? 'per app' : 'account-wide')}</b>${
        a.scope === 'per-app'
          ? ' — each app needs its own.'
          : ` — store ${one ? 'it' : 'them'} once and every project that needs ${one ? 'it' : 'them'}, now or later, is provisioned from ${one ? 'it' : 'them'}.`}</p>`;
  } else if (a.type === 'refused-surface') {
    body += `<h4>${ico('shield', 'sm')}<span class="lbl">Nothing to do</span></h4>
      <p>This one is not a question. It is launchpad declining to write a pipeline it cannot build, and it
      stays here until the pipeline exists. Run <code>/launchpad:setup</code> to see the refusal in full.</p>`;
  } else if (a.type === 'keep-or-migrate') {
    body += `<h4>${ico('layers', 'sm')}<span class="lbl">The other answer</span></h4>
      <p>${esc(a.alternative)}</p>
      <button class="btn" onclick="answerNeed(${i},'keep')">${ico('check', 'sm')}${esc(a.label)}</button>`;
  } else if (a.type === 'decide-money') {
    body += `<h4>${ico('zap', 'sm')}<span class="lbl">Your call</span></h4>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" onclick="answerNeed(${i},'accept')">${esc(a.accept)}</button>
        <button class="btn ghost" onclick="answerNeed(${i},'decline')">${esc(a.decline)}</button>
      </div>
      <p style="margin-top:14px">Either way it is recorded with today's date and shown on the Decisions
      tab, so a choice made months ago still reads as a choice you made.</p>`;
  } else if (a.type === 'confirm') {
    body += `<h4>${ico('check', 'sm')}<span class="lbl">Only you can answer this</span></h4>
      <p>launchpad cannot see inside a drawer, a password manager or an inbox, so it will not guess. It is
      recorded as your answer, dated, and it never counts against you either way.</p>
      <button class="btn" onclick="answerNeed(${i},'accept')">${ico('check', 'sm')}${esc(a.label)}</button>`;
  } else {
    body += `<button class="btn" onclick="answerNeed(${i},'acknowledged')">
      ${ico('check', 'sm')}${esc(a.label)}</button>`;
  }
  drawer(n.projects.map(x => x.label).join(' · '), n.title, body);
}

/** The card's one button. The same paths the drawer offers, one click shorter. */
function actOnNeed(i) {
  const n = (DATA.needs || [])[i];
  if (!n) return;
  const a = n.action;
  // Two kinds have nothing to record: a credential is stored in a terminal, and
  // a refusal is a fact rather than a question. Both open and explain instead.
  if (a.type === 'paste-credential' || a.type === 'refused-surface') return openNeed(i);
  if (a.type === 'keep-or-migrate') return answerNeed(i, 'keep');
  if (a.type === 'confirm') return answerNeed(i, 'accept');
  if (a.type === 'decide-money') return answerNeed(i, 'accept');
  return answerNeed(i, 'acknowledged');
}

/**
 * Record an answer.
 *
 * Three destinations, because the three answers are genuinely different things.
 * A scorecard row goes through the confirm flow that already existed. A
 * disposition goes into `state.yml`, because `apply` branches on it and nothing
 * else — an answer nothing enforces is worse than never asking. Everything else
 * is an acknowledgement, dated, in the same `confirmed.yml`.
 */
function answerNeed(i, choice) {
  const n = (DATA.needs || [])[i];
  if (!n) return;
  const a = n.action;
  closeDrawer();
  if (a.type === 'confirm') {
    return act(() => post('/api/confirm', { path: n.projectPath, check: a.check, confirmed: true }),
      'Noted — launchpad will stop asking');
  }
  if (a.type === 'keep-or-migrate') {
    return act(() => post('/api/disposition',
      { path: n.projectPath, pipeline: a.path, disposition: 'leave-alone' }),
    `${a.path} left alone`);
  }
  const paths = n.projects.map(p => p.path);
  act(() => post('/api/acknowledge', { paths, id: n.id, choice }),
    choice === 'decline' ? 'Noted — recorded as your decision' : 'Noted, and dated');
}

/* ── fleet ───────────────────────────────────────────────────────────── */
function paneFleet() {
  const t = DATA.totals;
  if (!DATA.projects.length) {
    return `<div class="soon">${ico('box')}<b>No projects yet</b>
      Register one with <code>launchpad add &lt;path&gt;</code>, or run
      <code>/launchpad:onboard</code> inside a repo.</div>`;
  }
  /**
   * The number strip.
   *
   * Three of these used to read `0 TASKS READY`, `0 BLOCKED`, `0 RUN TONIGHT`
   * in a row, which on the screen that is supposed to sell this reads as
   * "nothing is happening". Two changes. The first three tiles are now facts
   * about what exists rather than about a queue — done, apps, shipping
   * channels — and a queue tile only appears when there is a queue. A tile
   * that would say zero says nothing instead, because a zero here is the
   * absence of news, not news.
   */
  const tiles = [
    `<div class="hs"><div class="n">${t.projects}</div><div class="lbl l">Apps</div></div>`,
    t.done ? `<div class="hs good"><div class="n">${t.done}</div><div class="lbl l">Checks passed</div></div>` : '',
    t.channels ? `<div class="hs good"><div class="n">${t.channels}</div>
      <div class="lbl l">Shipping channels</div></div>` : '',
    t.criticalGaps
      ? `<div class="hs warn"><div class="n">${t.criticalGaps}</div><div class="lbl l">Critical gaps</div></div>`
      : t.released ? `<div class="hs good"><div class="n">${t.released}</div><div class="lbl l">Have released</div></div>` : '',
    t.tasksReady ? `<div class="hs"><div class="n">${t.tasksReady}</div><div class="lbl l">Tasks ready</div></div>` : '',
    t.tasksBlocked ? `<div class="hs warn"><div class="n">${t.tasksBlocked}</div><div class="lbl l">Blocked</div></div>` : '',
    t.readyTonight ? `<div class="hs"><div class="n">${t.readyTonight}</div><div class="lbl l">Run tonight</div></div>` : '',
  ].filter(Boolean).join('');

  // `averageScore` is 0 when nothing has been scored, and 0 paints a full red
  // ring around a red zero — which says "everything here is broken" about a
  // fleet nothing has looked at yet. No data draws no arc.
  const scored = t.onboarded > 0;
  const hero = `
    <div class="hero"${rise(0)}>
      <div class="bigring">${ring(scored ? t.averageScore : null, 112, 7, false)}
        <div class="mid"><span><span class="rv ${TICK ? 'tick' : ''}"
            style="color:${scored ? tone(t.averageScore) : 'var(--faint)'}">${scored ? t.remaining : '—'}</span>
          <span class="lbl">${!scored ? 'not scored yet' : t.remaining === 1 ? 'thing left' : 'things left'}</span></span></div></div>
      <div class="herostats">${tiles}</div>
    </div>`;

  const cards = DATA.projects.map((p, i) => {
    // `=== 'gap'`, matching the hero: an unanswered question is not a failure.
    const crit = p.score ? p.score.checks.filter(c => c.critical && c.grade === 'gap').length : 0;
    const ns = p.nightshift;
    const live = (p.live || [])[0];
    return `<div class="pcard"${rise(i * 45)} style="--p:${Number(p.accent) || 0}"
        onclick="go('${esc(p.path)}')">
      <div class="ph">
        <span class="ring">${ring(p.score ? p.score.score : null, 32, 2.6, true,
          markOf(p, 'xs'), p.score ? p.score.remaining : null)}</span>
        <span class="nm"><b>${esc(p.name)}</b>
          <span class="plats">${p.problem ? `<span class="plat">${esc(problemLabel(p))}</span>`
            : (p.archetypes || []).length ? (p.archetypes || []).map(platBadge).join('')
            : '<span class="plat" title="launchpad ships no pipeline for this kind of project — the scorecard and roadmap still do">no build surface</span>'}</span></span>
      </div>
      ${p.problem ? `<div class="empty">${ico('help', 'sm')}${esc(p.problem)}</div>
         ${p.dir ? `<div class="pf">${dirTag(p)}</div>` : ''}`
        : `${meter(p)}
           <div class="pf">
             ${dirTag(p)}
             ${crit ? `<span style="color:var(--gap)">${crit} critical</span>`
               : live ? `<span title="${esc(live.evidence)}">${esc(live.ref || 'never released')}</span>`
               : '<span>no channel yet</span>'}
             <span class="spacer"></span>
             ${ns.live.state === 'running' ? `<span style="color:var(--ok)">running now</span>`
               : ns.enabled ? `<span style="color:var(--ok);display:inline-flex;gap:5px;align-items:center">${ico('moon', 'sm')}tonight</span>`
               : ns.counts.ready ? `${ns.counts.ready} ready` : ''}
           </div>`}
    </div>`;
  }).join('');

  /**
   * Checks down the side, apps across the top — the transpose.
   *
   * The columns used to be the seventeen checks, which left 36px per label and
   * forced them onto their side in a 126px rotated band. Seventeen rotated
   * labels is the worst thing that was on this page. Checks are the long list;
   * long lists go down.
   */
  // The tooltip carries the qualifier: `.pname` stays the name itself so a
  // column of app names reads as a column of app names.
  const head = DATA.projects.map((p, pi) => `<th class="phead">
      <button onclick="go('${esc(p.path)}')" title="${esc(labelOf(p))}">
        ${markOf(p, 'sm')}
        <span class="pname">${esc(p.name)}</span>
        <span class="pmeta">${p.problem ? '—' : p.score.remaining === 0 ? 'ready' : p.score.remaining + ' left'}</span>
      </button></th>`).join('');

  const rows = DATA.columns.map(col => {
    const cells = DATA.projects.map((p, pi) => {
      if (p.problem) {
        return `<td><span class="cell na" title="${esc(p.name)} — ${esc(p.problem)}"></span></td>`;
      }
      const c = p.score.checks.find(x => x.id === col.id);
      const g = !c ? 'na' : c.grade === 'n/a' ? 'na' : c.grade;
      const crit = c && c.critical && c.grade === 'gap' ? ' crit' : '';
      const fresh = ARRIVED.has(p.path + '|' + col.id) ? ' arrived' : '';
      return `<td><button class="cell ${g}${crit}${fresh}"
        title="${esc(p.name)} — ${esc(c ? c.title : col.short)}"
        onclick="openCheck(${pi},'${col.id}')"></button></td>`;
    }).join('');
    // A check is critical for this fleet if it is critical and unmet anywhere.
    const critAnywhere = DATA.projects.some(p => p.score
      && p.score.checks.some(c => c.id === col.id && c.critical && c.grade === 'gap'));
    return `<tr><td class="rowhead"><span class="rh">${
      critAnywhere ? '<span class="crit" title="critical somewhere in this fleet"></span>' : ''
    }${esc(col.short)}</span></td>${cells}</tr>`;
  }).join('');

  /**
   * What the whole fleet costs, spelled out rather than chipped.
   *
   * The buyer's question was "we should use entirely free platforms, but what
   * WILL cost them money?" — and until now the answer was scattered across one
   * cost chip per decision per project. This is that, added up, with the split
   * that matters: what the platform charges whatever anyone does, versus what
   * is a consequence of a choice launchpad made and can therefore be reversed.
   */
  const cost = `<div class="card"${rise(70)}><div class="h"><h3>${ico('zap')}What this fleet costs</h3>
      <span class="spacer"></span>
      <span class="lbl">every number is a decision's own cost chip</span></div>
    <div class="b">${ledgerHtml(DATA.ledger, 'this fleet')}</div></div>`;

  return `${hero}
    <div class="pcards">${cards}</div>
    ${cost}
    ${paneLive()}
    <div class="lanehead">${ico('grid', 'sm')}<span class="lbl">The full rubric</span>
      <span class="n" style="margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint)">
        click a square for what it costs</span></div>
    <div class="gridwrap"${rise(120)}><table class="grid">
      <thead><tr><th class="corner"><span class="lbl">Check</span></th>${head}</tr></thead>
      <tbody>${rows}</tbody></table></div>
    <div class="legend">
      <span><i style="background:var(--ok)"></i>done</span>
      <span><i style="background:var(--gap)"></i>gap</span>
      <span><i style="background:var(--warn)"></i>can't tell</span>
      <span><i style="background:var(--na)"></i>n/a</span>
    </div>
    <div class="card" style="margin-top:20px"><div class="h"><h3>${ico('plus')}Add a project</h3>
      <span class="spacer"></span><span class="lbl">any git repo — onboarded or not</span></div>
      <div class="b">
        <div class="ideabox">
          <input id="addpath" placeholder="~/Code/my-app" onkeydown="if(event.key==='Enter')addProject()">
          <button class="btn" onclick="addProject()">${ico('plus', 'sm')}Add</button>
        </div>
        <div class="empty" style="padding-top:10px">${ico('help', 'sm')}<span>
          A repo that has not been onboarded still appears — as a row saying so, with the command to fix it.
          The interview that works out what a repo <em>is</em> belongs in Claude Code, where it can ask you
          things.</span></div>
      </div></div>`;
}

/**
 * What's live where.
 *
 * The one thing a person with six apps wants at a glance, and the honest
 * version of it. launchpad has no account with Apple, Google, Vercel or
 * Cloudflare and never will — so it cannot tell you a build passed review, and
 * this panel does not pretend to. It reports two facts it can read off `.git`:
 * the newest tag, for surfaces that ship when you tag, and the head commit,
 * for surfaces that deploy when you push. Every row prints which of the two it
 * is looking at, in the column on the right, every time.
 *
 * That caveat is the feature. A dashboard that claimed "live" from a tag would
 * be wrong the first time a submission was rejected, and being wrong about
 * *that* is how a tool that also holds your signing keys loses the argument.
 */
function liveRows(projects) {
  const rows = [];
  for (const p of projects) {
    for (const l of p.live || []) {
      rows.push(`<div class="liverow">
        <span class="who">${markOf(p, 'xs')}<b>${esc(p.name)}</b>${dirTag(p)}</span>
        <span class="chan">${platBadge(l.archetype)} ${esc(l.channel)}</span>
        <span class="ver ${l.ref ? '' : 'none'}">${esc(l.ref || '—')}</span>
        <span class="ev">${esc(l.evidence)}${l.at ? ' · ' + esc(when(l.at)) : ''}</span>
      </div>`);
    }
  }
  return rows;
}

function paneLive() {
  const rows = liveRows(DATA.projects);
  if (!rows.length) return '';
  return `<div class="card"${rise(90)}><div class="h"><h3>${ico('zap')}What's live where</h3>
      <span class="spacer"></span>
      <span class="lbl">read from your refs — launchpad never calls a store</span></div>
    <div class="b"><div class="lives">${rows.join('')}</div>
      <div class="empty" style="padding-top:11px">${ico('help', 'sm')}
        A tag says a release was cut, not that a store accepted it; a commit says what a push would
        deploy. Both are things this repository can prove. Nothing here is fetched from anyone's API.
      </div></div></div>`;
}

/* ── project panes ───────────────────────────────────────────────────── */
function paneReadiness(p, pi) {
  if (p.problem) return notOnboarded(p);
  const order = { gap: 0, unknown: 1, ok: 2 };
  /**
   * `n/a` rows are not on this list. A row about Flutter's network permission on
   * a native Android app is a row about somebody else's project, and this list
   * is the one a person works down. They stay in the full rubric grid, where a
   * slate cell is how a column says "does not apply", and in `score --json`.
   */
  const na = p.score.checks.filter(c => c.grade === 'n/a').length;
  const checks = p.score.checks.filter(c => c.grade !== 'n/a').sort((a, b) =>
    (a.critical && a.grade !== 'ok' ? -1 : 0) - (b.critical && b.grade !== 'ok' ? -1 : 0)
    || order[a.grade] - order[b.grade]);
  return `
    <div class="note">${ico('shield')}<span><b>${p.score.remaining === 0
        ? 'Nothing left that launchpad can see.'
        : `${p.score.remaining} thing${p.score.remaining === 1 ? '' : 's'} between this and a product.`}</b>
      ${p.score.next ? `Start with <b>${esc(p.score.next.title.toLowerCase())}</b>. ` : ''}Every one names what it
      actually costs — that list is the thing most people have never seen.${p.score.unconfirmed
        ? ` ${p.score.unconfirmed} ${p.score.unconfirmed === 1 ? 'is' : 'are'} only yours to answer, and ${p.score.unconfirmed === 1 ? 'is' : 'are'} not counted against you.`
        : ''}</span></div>
    <div class="checks">${checks.map((c, i) => `
      <button class="check"${rise(Math.min(i * 26, 320))} onclick="openCheck(${pi},'${c.id}')">
        <span class="chip ${c.grade === 'n/a' ? 'na' : c.grade}">${ico(GRADE_ICON[c.grade], 'sm')}</span>
        <span class="t"><b>${esc(c.title)}</b>
          ${c.critical && c.grade !== 'ok' ? '<span class="pill danger" style="margin-left:9px">critical</span>' : ''}
          ${c.grade !== 'ok' && c.detail ? `<p>${esc(c.detail)}</p>` : ''}</span>
        ${ico('chev', 'sm')}
      </button>`).join('')}</div>${na ? `
    <div class="empty nacount">${ico('minus', 'sm')}${na} more check${na === 1 ? ' does' : 's do'} not apply to this
      project — the full rubric on the fleet page shows ${na === 1 ? 'it' : 'them'} as slate cells.</div>` : ''}`;
}

function paneDeploy(p) {
  if (p.problem) return notOnboarded(p);
  const surfaces = p.surfaces_detail.map((s, i) => `
    <div class="card"${rise(i * 55)}>
      <div class="h"><h3>${ico(PLATFORM[s.archetype] ? PLATFORM[s.archetype][0] : 'box')}${esc(s.id)}</h3>
        ${platBadge(s.archetype)}
        <span class="pill ${s.status === 'wired' ? 'live' : 'warn'}">${esc(s.status)}</span></div>
      <div class="b">
        <div class="empty" style="padding:0 0 12px">${ico('help', 'sm')}Detected because: ${esc(s.evidence.join('; ') || 'n/a')}</div>
        ${s.config ? `<table class="kv">${Object.entries(s.config)

            Array.isArray(v) ? v.join(', ') : typeof v === 'object' ? JSON.stringify(v) : v)}</code></td></tr>`)
          .join('')}</table>` : `<div class="empty">${ico('minus', 'sm')}No config gathered yet.</div>`}
      </div></div>`).join('');

  const pipes = p.pipelines.length ? `
    <div class="card"><div class="h"><h3>${ico('layers')}Pipelines that were already here</h3></div><div class="b">
      <table class="kv">${p.pipelines.map(x => `<tr><td><span class="lbl">${esc(x.kind)}</span></td>
        <td><code>${esc(x.path)}</code> <span class="pill">${esc(x.disposition || 'undecided')}</span></td></tr>`).join('')}</table>
      </div></div>` : '';

  const a = p.assets || { screenshots: 0, featureGraphic: false };
  const store = `
    <div class="card"><div class="h"><h3>${ico('spark')}Store presence</h3>
      <span class="spacer"></span>
      <span class="lbl">what a store wants before it will show your app</span></div>
      <div class="b">
        <div style="display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap">
          ${p.iconUrl ? `<img class="icontile" style="width:64px;height:64px;border-radius:14px"
            src="${esc(p.iconUrl)}" alt="" onerror="this.remove()">` : ''}
          <table class="kv kvflex">
            <tr><td><span class="lbl">App icon</span></td><td>${a.icon
              ? `<code>${esc(a.icon.path)}</code> — ${a.icon.width || '?'}×${a.icon.height || '?'}${
                  a.icon.hasAlpha ? ' <span class="pill danger">has alpha</span>' : ''}`
              : '<span class="pill danger">none found</span>'}</td></tr>
            <tr><td><span class="lbl">Screenshots</span></td><td>${a.screenshots
              ? `${a.screenshots} found` : '<span class="pill warn">none found</span>'}</td></tr>
            <tr><td><span class="lbl">Feature graphic</span></td><td>${a.featureGraphic
              ? '<span class="pill live">present</span>'
              : longPill('warn', null, 'none — Play requires 1024×500')}</td></tr>
            <tr><td><span class="lbl">Listing metadata</span></td><td>${a.listingDir
              ? `<code>${esc(a.listingDir)}</code>` : '<span class="pill warn">none found</span>'}</td></tr>
          </table>
        </div>
      </div></div>`;

  const live = (p.live || []).length ? `
    <div class="card"><div class="h"><h3>${ico('zap')}Where this ships</h3>
      <span class="spacer"></span><span class="lbl">read from this repo's refs</span></div>
      <div class="b"><div class="lives">${(p.live || []).map(l => `
        <div class="liverow">
          <span class="who">${platBadge(l.archetype)}<b>${esc(l.surface)}</b></span>
          <span class="chan">${esc(l.channel)}</span>
          <span class="ver ${l.ref ? '' : 'none'}">${esc(l.ref || '—')}</span>
          <span class="ev">${esc(l.evidence)}${l.at ? ' · ' + esc(when(l.at)) : ''}</span>
        </div>`).join('')}</div></div></div>` : '';

  return `<div class="note">${ico('rocket')}<span><b>A release is a deliberate act</b>, never a side effect of
    pushing. Cut one with <code>/launchpad:release</code> in this repo.</span></div>
    ${live}${surfaces || `<div class="note">${ico('help')}<span><b>No build surface here.</b>
      launchpad ships pipelines for iOS, Android, macOS apps, web apps and static sites, and this repo
      is none of those — a real limit rather than a detection failure. Readiness and the roadmap still
      apply in full; most of the checklist has nothing to do with what a project is built in.</span></div>`}${pipes}${store}`;
}

function paneDecisions(p) {
  if (p.problem) return notOnboarded(p);
  if (!p.decisions.length) return `<div class="empty">${ico('minus', 'sm')}Nothing wired yet, so nothing decided.</div>`;
  const ahead = p.decisions.filter(d => d.proposed).length;
  /**
   * Before `apply`, these are proposals — and they are also the pitch. The panel
   * says which it is looking at, because a plan presented as an accomplished
   * fact is the one thing that would make this screen worthless.
   */
  const note = ahead === p.decisions.filter(d => d.source === 'launchpad').length && ahead > 0
    ? `<b>This is what launchpad would do here, and why.</b> Nothing below has happened yet — the
       reasoning is the part that took years of failed runs to learn, so you get to read it before
       you decide anything.`
    : `<b>This is what you actually bought.</b> The pipelines are commodity — these choices, and the
       reasons under them, are the part that took years of failed runs to learn.`;
  /**
   * The answers this person gave, dated.
   *
   * An item that vanishes from the strip when a button is pressed and leaves no
   * record anywhere is a button that HID a decision rather than recording one.
   * This is where it is reachable afterwards, and the wording matters: "you
   * decided this on 3 March" is a different sentence from "this is handled",
   * and only one of them is something launchpad can vouch for.
   */
  const answered = (p.answered || []).length ? `
    <div class="card"><div class="h"><h3>${ico('check')}Answered by you</h3>
      <span class="spacer"></span><span class="lbl">recorded in .launchpad/confirmed.yml</span></div>
      <div class="b"><table class="kv">${p.answered.map(a => `
        <tr><td><span class="lbl">${esc(a.id)}</span></td>
          <td>You decided this on <b>${esc(a.at)}</b>${a.choice && a.choice !== 'acknowledged'
            ? ` — <code>${esc(a.choice)}</code>` : ''}${a.note ? ` <span class="dir">${esc(a.note)}</span>` : ''}</td>
        </tr>`).join('')}</table>
        <div class="empty" style="padding-top:11px">${ico('help', 'sm')}Delete a line from that file and
          launchpad asks again. Nothing here can turn a gap green — the scorecard never reads these.</div>
      </div></div>` : '';

  return `
    <div class="note">${ico('bulb')}<span>${note}</span></div>
    ${answered}
    <div class="card">${p.decisions.map((d, i) => `
      <div class="dec"${rise(Math.min(i * 24, 300))}>
        <span class="lbl">${esc(d.area)}</span>
        <div class="t2"><span class="ch">${md(d.choice)}</span>
          <span class="pill ${d.source === 'yours' ? '' : d.proposed ? '' : 'acc'}">
            ${ico(d.source === 'yours' ? 'shield' : d.proposed ? 'route' : 'spark')}${
              d.source === 'yours' ? 'yours, kept' : d.proposed ? 'would choose' : 'launchpad chose'}</span>
          ${d.cost ? longPill('warn', 'zap', d.cost) : ''}</div>
        <p class="wy">${md(d.why)}</p>
      </div>`).join('')}</div>`;
}

/**
 * Roadmap — the work, and only then who runs it.
 *
 * "Tonight" put a scheduling window in front of the backlog, which is backwards:
 * the backlog is the project's roadmap, and Nightshift is one of two ways to
 * execute it. A fresh Claude session is the other, so both appear here as peers
 * and every ready task offers a prompt you can paste into one right now.
 */
function paneRoadmap(p, pi) {
  if (p.problem) return notOnboarded(p);
  const n = p.nightshift;
  if (!n.configured) {
    return `<div class="note">${ico('moon')}<span><b>No roadmap here yet.</b> Set one up and you get a backlog
      this project owns, plus the option of an overnight worker. It stays off until you say otherwise —
      an agent that writes code overnight should never switch itself on.</span></div>
      <code class="cmd">${ico('play', 'sm')}/launchpad:nightshift</code>`;
  }

  const lane = (title, icon, items, opts) => !items.length ? '' : `
    <div class="lane"><div class="lanehead">${ico(icon, 'sm')}<span class="lbl">${title}</span>
      <span class="n">${items.length}</span></div>
      <ul class="tasks">${items.slice(0, opts && opts.max || 10).map((t, i) => `
        <li class="${opts && opts.highlightFirst && i === 0 ? 'first' : ''}">
          <span class="tid">${esc(t.id)}</span>
          <span class="ttitle">${esc(t.title)}
            ${t.reason ? `<span class="treason">${ico('alert', 'sm')}${esc(t.reason)}</span>` : ''}
            ${t.status === 'blocked' && !t.reason
              ? `<span class="treason">${ico('alert', 'sm')}no reason recorded — suspect a transient failure</span>` : ''}
          </span>
          ${opts && opts.actions ? opts.actions(t, i) : (t.priority != null ? `<span class="tid">P${t.priority}</span>` : '')}
        </li>`).join('')}</ul>
      ${items.length > (opts && opts.max || 10) ? `<div class="empty">${ico('minus', 'sm')}+ ${items.length - (opts && opts.max || 10)} more</div>` : ''}
    </div>`;

  const runNow = t => `<button class="btn ghost sm" onclick="event.stopPropagation();promptFor(${pi},'${esc(t.id)}')">
      ${ico('play', 'sm')}Work on it</button>`;

  const ready = n.queue.map(t => t);
  const inboxItems = n.inbox.map((l, i) => ({ id: '—', title: l, status: 'idea' }));

  const livebar = n.live.state === 'running'
    ? `<div class="livebar"><span class="livedot"></span><b>Running now</b>
        <span style="color:var(--muted)">${esc(n.liveLabel)}</span></div>`
    : n.live.state === 'crashed'
      ? `<div class="livebar dead"><span class="livedot"></span><b>Stopped mid-run</b>
          <span style="color:var(--muted)">${esc(n.liveLabel)}</span></div>`
      : '';

  return `
    ${livebar}
    <div class="card"><div class="h"><h3>${ico('spark')}Capture an idea</h3>
      <span class="spacer"></span>
      <span class="lbl">goes straight into this project's backlog</span></div>
      <div class="b">
        <div class="ideabox">
          <input id="idea-${pi}" placeholder="Something to build…"
            onkeydown="if(event.key==='Enter')sendIdea(${pi})">
          <button class="btn" onclick="sendIdea(${pi})">${ico('plus', 'sm')}Capture</button>
        </div>
      </div></div>

    <div class="execs">
      <div class="exec ${n.enabled ? 'on' : ''}">
        <div class="eh">${ico('moon', 'lg')}<b>Overnight</b><span class="spacer"></span>
          <span class="toggle"><button class="switch" data-on="${n.enabled}" onclick="toggleProject(${pi})"
            aria-label="Nightshift on or off"></button>${n.enabled ? 'on' : 'off'}</span></div>
        <p>${n.problems.length
          ? `Will not run: ${n.problems.map(esc).join(' · ')}`
          : `Runs ${esc(n.window)}, up to ${n.maxTasksPerNight} task(s), gated by <code>${esc(n.gate)}</code>,
             landing as ${n.mode === 'pr' ? 'pull requests' : `pushes to <code>${esc(n.baseBranch)}</code>`}.`}</p>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <span class="pill ${n.mode === 'push' ? 'danger' : 'acc'}">${esc(n.mode === 'pr' ? 'opens PRs' : 'pushes')}</span>
          <span class="pill">${ico('clock')}${esc(n.window)}</span>
          <span class="pill ${n.groom ? 'acc' : ''}">${n.groom ? 'grooms first' : 'grooming off'}</span>
        </div>
      </div>
      <div class="exec">
        <div class="eh">${ico('zap', 'lg')}<b>Right now</b></div>
        <p>The same backlog, run attended. Open Claude Code in this repo and hand it the top task —
          <b>Work on it</b> copies a prompt that points at the task file and the gate.</p>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <span class="pill">${ico('shield')}same gate</span><span class="pill">${ico('route')}same backlog</span>
        </div>
      </div>
    </div>

    <div class="card"><div class="h"><h3>${ico('plus')}Add a task</h3>
      <span class="spacer"></span><span class="lbl">straight to the queue, no grooming</span></div>
      <div class="b"><div class="ideabox">
        <input id="newtask-${pi}" placeholder="Something you already know you want…"
          onkeydown="if(event.key==='Enter')addTask(${pi})">
        <select id="newprio-${pi}" style="padding:0 10px;border-radius:11px;border:1px solid var(--line2);
          background:var(--e0);color:var(--ink);font:inherit;font-size:13px">
          <option value="0">P0</option><option value="1" selected>P1</option><option value="2">P2</option>
        </select>
        <button class="btn" onclick="addTask(${pi})">${ico('plus', 'sm')}Add</button>
      </div></div></div>

    <div class="card"><div class="h"><h3>${ico('route')}Backlog</h3>
      ${n.backlogDir ? `<span class="pill">${esc(n.backlogDir)}</span>` : ''}
      <span class="spacer"></span>
      <span class="lbl">${n.counts.total} total · ${n.counts.done} done</span></div>
      <div class="b">
        ${lane('Waiting to be groomed', 'spark', inboxItems, { max: 6 })}
        ${lane('Needs your decision', 'help', n.needsDecision.map(d => ({
          id: d.id, title: d.title, status: 'idea', reason: d.why,
        })), { max: 10, actions: t =>
          `<button class="btn ghost sm" onclick="setTask(${pi},'${esc(t.id)}','ready')">
            ${ico('check', 'sm')}It's ready</button>` })}
        ${lane('Next up', 'play', ready, { highlightFirst: true, actions: (t, i) =>
          `<span style="display:flex;gap:6px;align-items:center">${i === 0
            ? `<span class="nowtag">${ico('chev', 'sm')}first</span>` : ''}
            <span class="prio">${[0, 1, 2].map(n => `<button class="${t.priority === n ? 'on' : ''}"
              title="Priority ${n}" onclick="event.stopPropagation();setPrio(${pi},'${esc(t.id)}',${n})">P${n}</button>`).join('')}</span>
            ${runNow(t)}</span>` })}
        ${lane('Blocked', 'alert', n.blocked, { max: 20, actions: t =>
          `<span style="display:flex;gap:6px">
            <button class="btn ghost sm" onclick="setTask(${pi},'${esc(t.id)}','ready')">${ico('refresh', 'sm')}Retry</button>
            <button class="btn ghost sm" onclick="setTask(${pi},'${esc(t.id)}','scoped')">Re-scope</button></span>` })}
        ${!ready.length && !n.blocked.length && !inboxItems.length
          ? `<div class="empty">${ico('check', 'sm')}Nothing queued. ${n.counts.idea + n.counts.scoped
              ? `${n.counts.idea + n.counts.scoped} task(s) still need grooming.`
              : 'A finished backlog is a good outcome.'}</div>` : ''}
        <div class="legend" style="margin-top:4px">
          <span>${n.counts.ready} ready</span><span>${n.counts.scoped} scoped</span>
          <span>${n.counts.idea} idea</span><span>${n.counts.blocked} blocked</span>
          <span>${n.counts.done} done</span></div>
      </div></div>

    ${p.lastNight.length ? `
    <div class="card"><div class="h"><h3>${ico('clock')}${esc(p.lastNightDate || 'Last run')}</h3>
      <span class="spacer"></span><span class="lbl">derived from what was observed, never from what the agent claimed</span></div>
      <div class="b"><ul class="tasks">${p.lastNight.map(r => `
        <li><span class="tid">${esc(r.taskId)}</span>
          <span class="ttitle">${esc(r.title)}${r.commit ? ` <span class="tid">${esc(r.commit)}</span>` : ''}</span>
          <span class="outcome ${esc(r.outcome)}">${esc(r.outcome.replace('-', ' '))}</span></li>`).join('')}</ul>
      </div></div>` : ''}`;
}

/**
 * A `launchpad …` command as this machine runs it. Nobody has `launchpad` on
 * their PATH; the server says where its own CLI is (`DATA.invocation`).
 */
function runCmd(c) {
  const inv = (DATA && DATA.invocation) || 'launchpad';
  return c.replace(/(^|\| )launchpad(?= )/, (m, pre) => pre + inv);
}
/** Where credentials go on this machine, in the words `doctor` uses. */
function vaultPlace() {
  const v = DATA && DATA.vault;
  if (!v) return 'your vault';
  return v.keychain ? `your ${v.backend === 'keychain' ? 'macOS Keychain' : 'system keyring'}` : 'the encrypted vault file in your home folder';
}

function paneSecrets(p) {
  if (p.problem) return notOnboarded(p);
  if (!p.secrets.length) return `<div class="empty">${ico('check', 'sm')}This project needs no credentials.</div>`;
  const missing = p.secrets.filter(s => !s.present).length;
  return `
    <div class="note">${ico('key')}<span><b>Presence only — values are never read, sent or displayed.</b>
      They live in ${esc(vaultPlace())} and go straight to GitHub via <code>launchpad secrets</code>.</span></div>
    ${missing ? `<div class="note bad">${ico('alert')}<span><b>${missing} missing.</b> The cards in the
      strip above say where to get each one and give the command that stores it; <code>/launchpad:doctor</code>
      walks through them in Claude Code.</span></div>` : ''}
    <div class="card"><div class="b"><table class="kv">${p.secrets.map(s => `
      <tr><td><code>${esc(s.key)}</code></td>
      <td style="text-align:right">${s.present ? `<span class="pill live">${ico('check')}in vault</span>`
        : `<span class="pill danger">${ico('alert')}missing</span>`}</td></tr>`).join('')}</table></div></div>`;
}

const paneMarketing = () => `
  <div class="soon">${ico('mega', 'lg')}<b>Coming</b>
    The marketing engine is being finished separately. Nothing here posts anything yet, and this section
    stays visibly empty rather than half-working.</div>`;

/**
 * The panel for a row that has no data — and it matters which reason.
 *
 * It used to say "is not onboarded yet" for all three, including a `state.yml`
 * that exists and will not parse. That project IS onboarded, and the command
 * underneath re-ran the interview over it: launchpad would have rewritten the
 * file from a fresh detection and thrown away whatever configuration the user
 * had gathered. So a broken state file gets the parse error and the two safe
 * moves, and no `onboard`.
 */
const notOnboarded = p => {
  if (p.problemKind === 'unreadable-state') {
    return `
      <div class="note bad">${ico('alert')}<span><b>${esc(p.name)} is set up, but launchpad cannot read its
        state file.</b> <code>.launchpad/state.yml</code> exists and does not parse, so nothing on this
        project can be scored until it does. This is not a project that needs onboarding — re-running
        onboard here would rewrite the file from scratch and discard whatever is in it.</span></div>
      <div class="note">${ico('help')}<span><b>What the parser said.</b>
        ${esc(String(p.problem || '').replace(/^\.launchpad\/state\.yml cannot be read — /, ''))}</span></div>
      <div class="note">${ico('shield')}<span><b>Two ways out.</b> Fix the line the parser names — the file
        is small and hand-editable YAML — or delete it and run onboard again, which starts from a fresh
        detection and loses any per-surface config that was gathered.</span></div>
      <code class="cmd">${ico('play', 'sm')}\$EDITOR .launchpad/state.yml</code>`;
  }
  if (p.problemKind === 'missing-directory') {
    return `
      <div class="note bad">${ico('alert')}<span><b>${esc(p.name)} is not on disk any more.</b>
        ${esc(p.problem || '')} Nothing was deleted by launchpad — the registry holds paths only. If the
        repository moved, stop tracking this row and add it at its new location.</span></div>`;
  }
  return `
  <div class="note">${ico('help')}<span><b>${esc(p.name)} is not onboarded yet.</b> ${esc(p.problem || '')}</span></div>
  <code class="cmd">${ico('play', 'sm')}/launchpad:onboard</code>`;
};

/* ── drawer ──────────────────────────────────────────────────────────── */
const PIPELINE_FIX = {
  'ci-build': '/launchpad:setup   then   /launchpad:apply',
  'test-gate': '/launchpad:setup   then   /launchpad:apply',
  'distribution': '/launchpad:setup   then   /launchpad:apply',
  'notarization': '/launchpad:setup   then   /launchpad:apply',
  'android-signing': '/launchpad:setup   then   /launchpad:apply',
  'auto-update': '/launchpad:setup   then   /launchpad:apply',
  'versioning': '/launchpad:release',
  'secrets-hygiene': '/launchpad:doctor',
  'keystore-backup': '/launchpad:doctor',
};

function openCheck(pi, id) {
  const p = DATA.projects[pi];
  const c = (p.score ? p.score.checks : []).find(x => x.id === id);
  const col = DATA.columns.find(x => x.id === id);
  if (!c) {
    return drawer(p.name, col ? col.short : id,
      `<p>Not applicable here — nothing to do. A web app has no upload keystore, and a library has
       nothing to notarize.</p>`);
  }
  const cmd = PIPELINE_FIX[id];
  let body = c.grade === 'ok'
    ? (c.confirmedAt
      // Attributed, not verified. launchpad did not see this; the user said it.
      ? `<p style="display:flex;gap:9px;align-items:center">${ico('check')}You confirmed this${
        c.confirmedAt === 'unknown' ? '' : ` on ${esc(c.confirmedAt)}`}.</p>
         <p style="margin-bottom:12px">launchpad cannot check this one itself, so it is recorded as your
         answer rather than as a verified fact.</p>
         <button class="btn ghost sm" onclick="answerCheck(${pi},'${id}',false)">
           ${ico('x', 'sm')}Actually, ask me again</button>`
      : `<p style="color:var(--ok);display:flex;gap:9px;align-items:center">${ico('check')}This one is done.</p>`)
    : `<p>${esc(c.detail)}</p>`;
  /**
   * The dead end, given an exit.
   *
   * A `?` used to say "only you can confirm this" and then offer no way to
   * confirm anything — so it sat there forever, and two of them were marked
   * critical, meaning every Android project showed a permanent critical warning
   * no action could clear. A question asked every time and never answerable is
   * not diligence, it is nagging, and it teaches people to skim the whole list.
   */
  if (c.answerable) {
    body += `<h4>${ico('check', 'sm')}<span class="lbl">Only you can answer this</span></h4>
       <p style="margin-bottom:12px">launchpad cannot see inside a drawer, a password manager or an
       inbox, so it will not guess. If this is handled, say so and it stops asking — it is recorded as
       your answer, and it never counts against you either way.</p>
       <button class="btn" onclick="answerCheck(${pi},'${id}',true)">
         ${ico('check', 'sm')}Yes, this is handled</button>`;
  }
  if (c.grade !== 'ok' && !c.answerable) {
    body += cmd
      ? `<h4>${ico('zap', 'sm')}<span class="lbl">Fix it</span></h4>
         <p style="margin-bottom:4px">launchpad does this one for you. Run this in Claude Code, inside
         <code>${esc(p.name)}</code>:</p>
         <code class="cmd">${esc(cmd)}</code>
         <button class="btn ghost sm" style="margin-top:10px" onclick="copy('${esc(cmd)}','Command')">
           ${ico('copy', 'sm')}Copy</button>`
      : `<h4>${ico('route', 'sm')}<span class="lbl">Queue it</span></h4>
         <p style="margin-bottom:12px">This is work rather than configuration. Put it on
         ${esc(p.name)}'s roadmap and either the overnight worker or your next Claude session takes it.</p>
         <button class="btn" onclick="queueGap(${pi},'${id}')">${ico('plus', 'sm')}Add to the roadmap</button>`;
  }
  drawer(p.name + (c.critical && c.grade !== 'ok' ? ' · critical' : ''), c.title, body);
}
/** Record — or withdraw — an answer to a question launchpad cannot answer itself. */
function answerCheck(pi, id, yes) {
  const p = DATA.projects[pi];
  act(() => post('/api/confirm', { path: p.path, check: id, confirmed: yes }),
    yes ? 'Noted — launchpad will stop asking' : 'Back to unanswered');
  closeDrawer();
}
function queueGap(pi, id) {
  const p = DATA.projects[pi];
  const c = p.score.checks.find(x => x.id === id);
  act(() => post('/api/idea', { path: p.path, text: c.title + ' — ' + c.detail }), 'Added to ' + p.name);
  closeDrawer();
}
/** The attended path: a prompt a fresh Claude session can act on directly. */
function promptFor(pi, id) {
  const p = DATA.projects[pi], n = p.nightshift;
  const t = n.queue.find(x => x.id === id) || {};
  const dir = n.backlogDir || '.launchpad/nightshift/backlog';
  const text = `Work on task ${id} in this repo.\n\n`
    + `Read ${dir}/${id}.md for the brief${t.title ? ` — "${t.title}"` : ''}.\n`
    + `Run \`${n.gate}\` before you finish; it must exit 0, and never edit it to make it pass.\n`
    + `Change one thing. When it passes, set the task's status to done.`;
  copy(text, 'Prompt for ' + id);
}
function drawer(eyebrow, title, html) {
  $('#dEyebrow').textContent = eyebrow; $('#dTitle').textContent = title; $('#dBody').innerHTML = html;
  $('#drawer').classList.add('open'); $('#scrim').classList.add('open');
}
function closeDrawer() { $('#drawer').classList.remove('open'); $('#scrim').classList.remove('open'); }
$('#drawerClose').onclick = closeDrawer;
$('#scrim').onclick = closeDrawer;
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

/* ── writes ──────────────────────────────────────────────────────────── */
function sendIdea(pi) {
  const el = $('#idea-' + pi), text = el.value.trim();
  if (!text) return;
  const p = DATA.projects[pi];
  el.value = '';
  act(() => post('/api/idea', { path: p.path, text }), 'Captured for ' + p.name);
}
function toggleProject(pi) {
  const p = DATA.projects[pi], next = !p.nightshift.enabled;
  act(() => post('/api/nightshift/enabled', { path: p.path, enabled: next }),
      next ? 'Overnight worker on for ' + p.name : 'Overnight worker off for ' + p.name);
}
function addProject() {
  const el = $('#addpath'), path = el.value.trim();
  if (!path) return;
  el.value = '';
  act(() => post('/api/projects/add', { path }), 'Added');
}
function removeProject(pi) {
  const p = DATA.projects[pi];
  // The registry holds only paths, so this is not destructive — worth saying,
  // because "remove" next to someone's project reads as though it might be.
  if (!confirm(`Stop tracking ${p.name}?\n\nThe repository is untouched — this only removes it from the list.`)) return;
  VIEW.project = null;
  act(() => post('/api/projects/remove', { path: p.path }), 'Removed from the list');
}
function addTask(pi) {
  const el = $('#newtask-' + pi), title = el.value.trim();
  if (!title) return;
  const p = DATA.projects[pi];
  const priority = Number($('#newprio-' + pi).value);
  el.value = '';
  act(() => post('/api/task/create', { path: p.path, title, priority }), 'Queued for ' + p.name);
}
function setPrio(pi, id, priority) {
  const p = DATA.projects[pi];
  act(() => post('/api/task/priority', { path: p.path, id, priority }), id + ' → P' + priority);
}
function setTask(pi, id, status) {
  const p = DATA.projects[pi];
  act(() => post('/api/task', { path: p.path, id, status }), id + ' → ' + status);
}

/* ── render ──────────────────────────────────────────────────────────── */
function render() {
  if (VIEW.project && !cur()) { VIEW.project = null; VIEW.tab = 'fleet'; }
  const key = VIEW.project + '|' + VIEW.tab;
  ANIM = key !== lastKey;
  lastKey = key;
  renderNeedsStrip(); renderNav(); renderTop();
  const p = cur();
  // Consumed by exactly one render. A later re-render from clicking a tab must
  // not replay a flash for a check that resolved three minutes ago.
  if (!p) {
    $('#panes').innerHTML = `<div class="pane-fleet">${paneFleet()}</div>`;
  } else {
    const pi = DATA.projects.indexOf(p);
    const body = {
      readiness: paneReadiness, deploy: paneDeploy, decisions: paneDecisions,
      roadmap: paneRoadmap, secrets: paneSecrets, marketing: paneMarketing,
    }[VIEW.tab] || paneReadiness;
    $('#panes').innerHTML = `<div class="panel"><div class="panebody">${body(p, pi)}</div>
      ${PANE_NOTE[VIEW.tab] ? `<div class="panefoot">${ico('help', 'sm')}<span>${PANE_NOTE[VIEW.tab]}</span></div>` : ''}</div>`;
  }
  ARRIVED = new Set(); TICK = false;
}

/**
 * The closing line on each tab.
 *
 * Half of these panels are two cards tall on a small project, which left most
 * of the viewport black underneath — the "large black region" the audit saw
 * mid-scroll. A panel with a floor and one sentence saying what the tab is for
 * ends the page rather than letting it trail off, and none of these sentences
 * claims anything the product does not already do.
 */
const PANE_NOTE = {
  readiness: 'Every row names what it costs, not just that it is missing. Click one for the '
    + 'consequence and the command that fixes it — or, where it is genuinely work rather than '
    + 'configuration, to put it on this project\'s roadmap.',
  deploy: 'Detected, not declared. Each surface shows the evidence that found it and the exact '
    + 'config <code>apply</code> will use, so nothing is wired on a guess you cannot see.',
  decisions: 'Every entry says who decided — <b>launchpad chose</b> or <b>yours, kept</b>. '
    + 'They are different promises, and a tool that blurs them is either taking credit for your '
    + 'work or implying it maintains something it has never touched.',
  roadmap: 'One backlog, two ways to run it: unattended overnight, or attended in a fresh Claude '
    + 'session. Same tasks, same gate. Nothing runs unless a gate command exists to check it.',
  secrets: 'Presence only. launchpad reads whether a credential is in your vault and never reads '
    + 'the value — not into this page, not into a log, not into a report.',
  marketing: 'Deliberately empty rather than half-working. An obviously unfinished section reads '
    + 'as a roadmap; a half-working one reads as broken.',
};

/* ── theme ───────────────────────────────────────────────────────────
   Three states, not two: `auto` follows the OS, and only an explicit choice
   writes data-theme. Storing "dark" when the OS is already dark would freeze
   the page against a later OS change the user does expect to be followed. */
const THEMES = ['auto', 'light', 'dark'];
function applyTheme(t) {
  if (t === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
  const osDark = matchMedia('(prefers-color-scheme: dark)').matches;
  const shown = t === 'auto' ? (osDark ? 'dark' : 'light') : t;
  $('#themebtn').innerHTML = ico(shown === 'dark' ? 'moon' : 'sun', 'sm')
    + `<span>${t === 'auto' ? 'auto · ' + shown : t}</span>`;
}
let theme = localStorage.getItem('lp-theme') || 'auto';
$('#themebtn').onclick = () => {
  theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
  localStorage.setItem('lp-theme', theme);
  applyTheme(theme);
};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => applyTheme(theme));
applyTheme(theme);

/* ── demo mode ────────────────────────────────────────────────────────────
   Said in three places that survive a crop: a band across the top, the
   sidebar wordmark, and the browser tab. A screenshot of seven invented apps
   must not be passable as a screenshot of somebody's real fleet — by us or by
   anyone who reposts it. */
if (DEMO) {
  const bar = $('#demobar');
  bar.hidden = false;
  /* The slot that was rendered and never written. It names the temp folder as
     parent/basename, because the whole path is exactly what must not appear in
     a screenshot — the terminal prints that. Hidden below 560px, where the band
     is only the warning and there is no room for anything else. */
  const root = $('#demoroot');
  if (root) root.textContent = DEMO_ROOT;
  document.title = 'Mission Control — DEMO DATA';
  const sub = $('#brandsub');
  if (sub) { sub.textContent = 'demo fleet · not real'; sub.style.color = 'var(--warn)'; }
  /**
   * `--topbar` follows the band's real height, not a resize event.
   *
   * The band is shorter under the ≤700px rules than on the desktop, and
   * `aside.nav` is positioned against this variable. Binding it to `resize`
   * meant any viewport change that did not deliver one — a devtools dock, a
   * headless `setViewportSize`, a media query flipping for another reason —
   * left the whole sidebar about seven pixels out of place. A ResizeObserver
   * watches the thing that actually changes; `resize` stays as the fallback for
   * a browser without one.
   */
  const setTop = () => document.documentElement.style.setProperty('--topbar', bar.offsetHeight + 'px');
  setTop();
  if (window.ResizeObserver) new ResizeObserver(setTop).observe(bar);
  else addEventListener('resize', setTop);
}

load().then(connect).catch(() => connect());
</script>
</body>
</html>
